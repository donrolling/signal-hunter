<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Hunter</title>
<style>
  :root { --bg:#0f1115; --panel:#181b21; --raise:#21252d; --line:#2a2f38; --text:#e9e6df; --dim:#858c99; --accent:#f0b44c;
          --glow:rgba(240,180,76,.35); --mono:ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif; height:100vh;
         display:flex; flex-direction:column; overflow:hidden; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#2c313b; border-radius:5px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
  #wave ::part(scroll) { scrollbar-color:#2c313b #0a0c0f; }  /* wavesurfer's scroller lives in a shadow root */
  header { display:flex; gap:10px; align-items:center; padding:10px 16px; flex-wrap:wrap; background:linear-gradient(#1c2028,#15181e);
           border-bottom:1px solid #000; box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 2px 8px rgba(0,0,0,.35); position:relative; z-index:5; }
  .brand { display:flex; align-items:center; gap:10px; margin-right:10px; }
  .brand svg { width:30px; height:30px; display:block; }
  h1 { font-size:13px; margin:0; letter-spacing:.24em; font-weight:700; }
  h1 b { color:var(--accent); }
  input, button { color:var(--text); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font:inherit; }
  input { background:#0b0d10; box-shadow:inset 0 1px 3px rgba(0,0,0,.6); }
  input:focus { outline:none; border-color:var(--accent); box-shadow:inset 0 1px 3px rgba(0,0,0,.6), 0 0 0 2px var(--glow); }
  input[type=range] { accent-color:var(--accent); background:none; border:0; box-shadow:none; padding:0; }
  button { cursor:pointer; background:linear-gradient(#272b34,#1d2027); border-color:#343a46;
           box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.45); }
  button:hover { border-color:var(--accent); }
  button:active { background:#181b20; box-shadow:inset 0 1px 3px rgba(0,0,0,.6); }
  button.on, button.primary { background:linear-gradient(#f6c46c,#e2a43a); color:#1a1306; border-color:#c48a2a; font-weight:600; }
  button.on, button.primary:hover { box-shadow:0 0 14px var(--glow); }
  button.on kbd, button.primary kbd { border-color:rgba(0,0,0,.3); }
  label { color:var(--dim); font-size:11px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:8px; align-items:center; }
  #q { flex:1; min-width:220px; }
  #count { color:var(--dim); font:12px var(--mono); }
  /* custom picker: Max's jweb can't open native <select> popups */
  #epPick { position:relative; }
  #epBtn { min-width:180px; text-align:left; }
  #epList { position:absolute; right:0; top:calc(100% + 4px); z-index:10; min-width:320px; max-height:60vh; overflow:auto; padding:4px 0;
            background:var(--raise); border:1px solid #000; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.55); }
  #epList[hidden] { display:none; }
  .opt { padding:6px 12px; cursor:pointer; white-space:nowrap; }
  .opt:hover { background:#2a2f39; } .opt.on { color:var(--accent); }
  main { flex:1; display:grid; grid-template-columns:minmax(280px, 40%) 1fr; min-height:0; }
  #results { overflow:auto; border-right:1px solid #000; box-shadow:1px 0 0 rgba(255,255,255,.03); }
  .seg { padding:7px 16px; border-bottom:1px solid #1b1e25; cursor:pointer; display:grid; grid-template-columns:auto 1fr; gap:2px 12px; }
  .seg:hover { background:var(--panel); }
  .seg.sel { background:var(--panel); box-shadow:inset 3px 0 0 var(--accent); }
  .seg .t { color:var(--accent); font:12px/1.65 var(--mono); }
  .seg .ep { grid-column:1/-1; color:var(--dim); font-size:11px; }
  mark { background:var(--accent); color:#1a1306; border-radius:2px; }
  #editor { padding:16px 18px; overflow:auto; background:radial-gradient(ellipse at top, #171a21, var(--bg) 70%); }
  #info { color:var(--dim); margin-bottom:8px; font-size:12px; }
  #wave { min-height:160px; border-radius:8px; border:1px solid #000; overflow:hidden;
          background:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/100% 40px, #0a0c0f;
          box-shadow:inset 0 2px 12px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.04); }
  #video { display:block; width:100%; max-height:360px; background:#000; border:1px solid #000; border-radius:8px; margin-bottom:8px; }
  #video[hidden], button[hidden] { display:none; }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  #name { flex:1; min-width:200px; }
  #sel { color:var(--accent); font:13px var(--mono); }
  #status { color:var(--dim); font-size:12px; }
  h3 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:24px 0 8px; font-weight:600; }
  #exports { color:var(--dim); list-style:none; padding:0; margin:0; font:12px/1.9 var(--mono); }
  #exports li::before { content:'▸ '; color:var(--accent); }
  #addRow { flex-basis:100%; display:flex; gap:8px; align-items:center; }
  #addSrc { flex:1; min-width:220px; }
  #imports { flex-basis:100%; display:flex; flex-direction:column; gap:4px; }
  #imports[hidden] { display:none; }
  .job { display:grid; grid-template-columns:18px auto 1fr auto; gap:8px; align-items:center; background:var(--panel);
         border:1px solid var(--line); border-radius:7px; padding:6px 10px; font-size:13px; }
  .job .ic { text-align:center; }
  .job .lbl { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw; }
  .job .msg { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .job.done { cursor:pointer; border-color:#4d7a50; } .job.done .ic { color:#7bc47f; }
  .job.error { border-color:#8a4a44; } .job.error .ic, .job.error .msg { color:#e8766b; white-space:normal; }
  .job .bar { grid-column:1/-1; height:4px; background:#0b0d10; border-radius:2px; overflow:hidden; }
  .job .bar i { display:block; height:100%; background:var(--accent); box-shadow:0 0 8px var(--glow); transition:width .3s; }
  .job .bar.indet i { animation:indet 1.2s linear infinite; }
  @keyframes indet { from { transform:translateX(-100%) } to { transform:translateX(340%) } }
  .spin { display:inline-block; width:11px; height:11px; border:2px solid var(--accent); border-right-color:transparent;
          border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg) } }
  .x { background:none; border:0; box-shadow:none; color:var(--dim); padding:0 4px; font-size:16px; line-height:1; }
  #drop { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; pointer-events:none;
          background:rgba(15,17,21,.88); border:3px dashed var(--accent); color:var(--accent); font-size:22px; }
  #drop[hidden] { display:none; }
  kbd { border:1px solid rgba(255,255,255,.18); border-radius:3px; padding:0 4px; margin-left:4px; font:10px var(--mono); opacity:.8; }
  @media (max-width:720px) { main { grid-template-columns:1fr; grid-template-rows:40% 1fr; } #results { border-right:0; border-bottom:1px solid #000; } }
</style>
</head>
<body>
<div id="drop" hidden>Drop audio or video to add it</div>
<header>
  <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="19" fill="none" stroke="#f0b44c" stroke-width="3"/><path d="M32 4v7M32 53v7M4 32h7M53 32h7" stroke="#f0b44c" stroke-width="3" stroke-linecap="round"/><path d="M17 32h4l3-6 4 14 4-20 4 16 3-8 2 4h6" fill="none" stroke="#e9e6df" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>SIGNAL <b>HUNTER</b></h1></div>
  <input id="q" placeholder="Search what they say… (useless, stars, dead)" autofocus>
  <div id="epPick"><button id="epBtn">All episodes ▾</button><div id="epList" hidden></div></div>
  <span id="count"></span>
  <div id="addRow">
    <input id="addSrc" placeholder="Add a source: paste a URL, archive.org link or file path — or drop files anywhere">
    <button id="addBtn">Add</button>
    <button id="browseBtn">Browse…</button>
    <input id="fileIn" type="file" multiple accept="audio/*,video/*,.mkv" hidden>
  </div>
  <div id="imports" hidden></div>
</header>
<main>
  <section id="results"></section>
  <section id="editor">
    <div id="info">Click a line to load it. Drag on the waveform to select.</div>
    <video id="video" playsinline hidden></video>
    <div id="wave"></div>
    <div class="row">
      <button id="playSel">▶ Selection <kbd>space</kbd></button>
      <button id="playWin">▶ Window</button>
      <button id="loop">⟲ Loop <kbd>L</kbd></button>
      <button id="back">◀ 10s</button>
      <button id="fwd">10s ▶</button>
      <label>Zoom <input id="zoom" type="range" min="10" max="500" value="40"></label>
    </div>
    <div class="row"><span id="sel"></span></div>
    <div class="row">
      <input id="name" placeholder="clip name">
      <button id="export" class="primary">Export WAV <kbd>E</kbd></button>
      <button id="exportMp4" hidden>Export MP4 <kbd>M</kbd></button>
      <button id="toLive" class="primary" hidden>Send to Live <kbd>S</kbd></button>
    </div>
    <div class="row" id="status"></div>
    <h3>Exports</h3>
    <ul id="exports"></ul>
  </section>
</main>
<script type="module">
import WaveSurfer from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.0/dist/wavesurfer.esm.js'
import Regions from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.0/dist/plugins/regions.esm.js'

const $ = id => document.getElementById(id)
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, '0')}`
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const slug = s => s.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 50)

let segs = [], cur = null, region = null, loop = false, epFilter = ''
const isVideo = {}
const REGION_COLOR = 'rgba(240,180,76,.22)'

const regions = Regions.create()
const ws = WaveSurfer.create({
  container: '#wave', media: $('video'), height: 160, waveColor: '#55606f', progressColor: '#f0b44c',
  cursorColor: '#fff', minPxPerSec: 40, plugins: [regions],
})
regions.enableDragSelection({ color: REGION_COLOR })
regions.on('region-created', r => { if (region && region !== r) region.remove(); region = r; showSel() })
regions.on('region-updated', showSel)
// Selection playback stops (or loops) at the region end ourselves. Poll the clock instead of
// relying on timeupdate events, which Max's jweb doesn't deliver reliably.
let selEnd = null
setInterval(() => {
  if (selEnd == null || !ws.isPlaying() || ws.getCurrentTime() < selEnd) return
  if (loop && region) ws.setTime(region.start)
  else { ws.pause(); selEnd = null }
}, 15)

function showSel() {
  if (!cur || !region) return ($('sel').textContent = '')
  const a = cur.start + region.start, b = cur.start + region.end
  $('sel').textContent = `Selection ${fmt(a)} → ${fmt(b)}  (${(b - a).toFixed(2)}s)`
}

async function load(ep, start, end, selA, selB) {
  start = Math.max(0, start)
  cur = { ep, start, end }
  $('video').hidden = $('exportMp4').hidden = !isVideo[ep]
  $('info').textContent = `${ep} · window ${fmt(start)}–${fmt(end)}`
  await ws.load(`/api/clip?ep=${encodeURIComponent(ep)}&start=${start}&end=${end}`)
  ws.zoom(+$('zoom').value)
  regions.clearRegions(); region = null
  if (selA != null) {
    const a = Math.max(0, selA - start), b = Math.min(end - start, selB - start)
    if (b > a) regions.addRegion({ start: a, end: b, color: REGION_COLOR })
  }
  showSel()
}

function render() {
  const q = $('q').value.trim().toLowerCase(), ep = epFilter
  const hits = segs.filter(s => (!ep || s.ep === ep) && (!q || s.text.toLowerCase().includes(q)))
  $('count').textContent = q ? `${hits.length} match${hits.length === 1 ? '' : 'es'}` : `all ${hits.length} transcript lines`
  const re = q && new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi')
  $('results').innerHTML = hits.slice(0, 600).map(s => {
    const text = re ? esc(s.text).replace(re, m => `<mark>${m}</mark>`) : esc(s.text)
    return `<div class="seg" data-i="${s.i}"><span class="t">${fmt(s.start)}</span><span>${text}</span>${ep ? '' : `<span class="ep">${esc(s.ep)}</span>`}</div>`
  }).join('')
}

$('results').onclick = e => {
  const row = e.target.closest('.seg'); if (!row) return
  document.querySelectorAll('.seg.sel').forEach(r => r.classList.remove('sel')); row.classList.add('sel')
  const s = segs[+row.dataset.i]
  $('name').value = slug(s.text.split(' ').slice(0, 6).join(' '))
  load(s.ep, s.start - 5, s.end + 15, s.start, s.end)
}

const shift = d => {
  if (!cur) return
  const keep = region && [cur.start + region.start, cur.start + region.end]
  load(cur.ep, cur.start + d, cur.end + d, ...(keep || []))
}
$('back').onclick = () => shift(-10)
$('fwd').onclick = () => shift(10)
$('zoom').oninput = e => ws.getDuration() && ws.zoom(+e.target.value)
$('playWin').onclick = () => { selEnd = null; ws.playPause() }
const playSel = () => {
  if (ws.isPlaying()) return ws.pause()
  if (region) { selEnd = region.end; ws.setTime(region.start) }
  ws.play()
}
$('playSel').onclick = playSel
const toggleLoop = () => { loop = !loop; $('loop').classList.toggle('on', loop) }
$('loop').onclick = toggleLoop

// Inside the Max for Live device's jweb, window.max exists and "Send to Live" drops the WAV
// into Live's highlighted clip slot (the device does the Live API call).
const inLive = new URLSearchParams(location.search).has('live')
$('toLive').hidden = !inLive

async function doExport(format = 'wav', toLive = false) {
  if (!cur || !region) return ($('status').textContent = 'Select a region first.')
  if (format === 'mp4' && !isVideo[cur.ep]) return
  $('status').textContent = `Exporting ${format.toUpperCase()}…`
  const body = { ep: cur.ep, start: cur.start + region.start, end: cur.start + region.end, name: $('name').value || 'clip', format }
  const r = await fetch('/api/export', { method: 'POST', body: JSON.stringify(body) }).then(r => r.json())
  if (!r.error && toLive) {
    if (!window.max?.outlet) return ($('status').textContent = `Saved ${r.path}, but Max isn't reachable: open this from the Live device`)
    // two messages, in order: point the device at the highlighted slot, then create the clip there
    window.max.outlet('locate')
    window.max.outlet('clip', r.path.replaceAll('\\', '/'))
  }
  $('status').textContent = r.error ? `Error: ${r.error}`
    : toLive ? `Sent ${r.file} to Live's highlighted clip slot` : `Saved ${r.path}`
  refreshExports()
}
$('export').onclick = () => doExport('wav')
$('exportMp4').onclick = () => doExport('mp4')
$('toLive').onclick = () => doExport('wav', true)

async function refreshExports() {
  const list = await fetch('/api/exports').then(r => r.json())
  $('exports').innerHTML = list.map(f => `<li>${esc(f)}</li>`).join('') || '<li>none yet</li>'
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return
  if (e.code === 'Space') { e.preventDefault(); playSel() }
  else if (e.key === 'l' || e.key === 'L') toggleLoop()
  else if (e.key === 'e' || e.key === 'E') doExport('wav')
  else if (e.key === 'm' || e.key === 'M') doExport('mp4')
  else if ((e.key === 's' || e.key === 'S') && inLive) doExport('wav', true)
})
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') doExport(cur && isVideo[cur.ep] ? 'mp4' : 'wav') })
$('q').oninput = render
function renderEpList() {
  $('epList').innerHTML = ['', ...Object.keys(isVideo)].map(n =>
    `<div class="opt${n === epFilter ? ' on' : ''}" data-ep="${esc(n)}">${n ? esc(n) : 'All episodes'}</div>`).join('')
}
$('epBtn').onclick = e => { e.stopPropagation(); renderEpList(); $('epList').hidden = !$('epList').hidden }
$('epList').onclick = e => {
  const o = e.target.closest('.opt'); if (!o) return
  epFilter = o.dataset.ep
  $('epBtn').textContent = `${epFilter || 'All episodes'} ▾`
  $('epList').hidden = true
  render()
}
document.addEventListener('click', () => { $('epList').hidden = true })

async function loadLibrary() {
  const lib = await fetch('/api/library').then(r => r.json())
  segs = []
  for (const k in isVideo) delete isVideo[k]
  lib.forEach(e => {
    isVideo[e.name] = e.video
    e.segments.forEach(s => segs.push({ ...s, ep: e.name, i: segs.length }))
  })
  render()
}

// ---- adding sources: paste box, Browse, drag and drop; the server downloads + transcribes in the background.
// Each import gets a row with its stage and a progress bar; a finished row jumps to the new episode.
let polling = null, doneSeen = -1, serverJobs = []
const localJobs = [], dismissed = new Set()  // localJobs: uploads in flight + errors before the server has a job

function renderImports() {
  const rows = [...serverJobs.filter(j => !dismissed.has(j.id)), ...localJobs].slice(-6)
  $('imports').hidden = !rows.length
  $('imports').innerHTML = rows.map(j => {
    const working = j.state === 'working', pct = j.progress != null ? Math.round(j.progress * 100) : null
    const icon = { done: '✓', error: '✕', queued: '⋯' }[j.state] || '<i class="spin"></i>'
    const msg = j.state === 'done' ? `${j.msg} · click to view` : j.msg + (working && pct != null ? ` · ${pct}%` : '')
    const bar = working ? `<div class="bar${pct == null ? ' indet' : ''}"><i style="width:${pct ?? 30}%"></i></div>` : ''
    const close = j.state === 'done' || j.state === 'error' ? `<button class="x" data-x="${j.id}" title="Dismiss">×</button>` : '<span></span>'
    return `<div class="job ${j.state}" data-ep="${esc((j.episodes || [])[0] || '')}"><span class="ic">${icon}</span>` +
      `<span class="lbl">${esc(j.label)}</span><span class="msg">${esc(msg)}</span>${close}${bar}</div>`
  }).join('')
}
$('imports').onclick = e => {
  const x = e.target.closest('[data-x]')
  if (x) {
    const i = localJobs.findIndex(j => String(j.id) === x.dataset.x)
    if (i >= 0) localJobs.splice(i, 1); else dismissed.add(+x.dataset.x)
    return renderImports()
  }
  const row = e.target.closest('.job.done'); if (!row || !row.dataset.ep) return
  epFilter = row.dataset.ep; $('epBtn').textContent = `${epFilter} ▾`; $('q').value = ''; render()
}
const localError = (label, msg) => { localJobs.push({ id: 'l' + Date.now(), label, state: 'error', msg }); renderImports() }

async function pollJobs() {
  try { serverJobs = await fetch('/api/jobs').then(r => r.json()) } catch { return }
  renderImports()
  const done = serverJobs.filter(j => j.state === 'done').length
  if (doneSeen >= 0 && done > doneSeen) await loadLibrary()  // a source finished: refresh list + picker
  doneSeen = done
  if (!serverJobs.some(j => j.state === 'queued' || j.state === 'working')) { clearInterval(polling); polling = null }
}
const startPolling = () => { if (!polling) polling = setInterval(pollJobs, 1000); pollJobs() }

async function addSrc() {
  const src = $('addSrc').value.trim(); if (!src) return
  const r = await fetch('/api/add', { method: 'POST', body: JSON.stringify({ src }) }).then(r => r.json())
  if (r.error) return localError(src, r.error)
  $('addSrc').value = ''
  startPolling()
}
function uploadOne(f) {  // XHR rather than fetch: it reports upload progress
  return new Promise(done => {
    const job = { id: 'u' + Date.now(), label: f.name, state: 'working', msg: 'uploading', progress: 0 }
    localJobs.push(job); renderImports()
    const x = new XMLHttpRequest()
    x.open('POST', `/api/upload?name=${encodeURIComponent(f.name)}`)
    x.upload.onprogress = e => { if (e.lengthComputable) { job.progress = e.loaded / e.total; renderImports() } }
    x.onload = () => {
      let r = {}; try { r = JSON.parse(x.responseText) } catch {}
      if (r.error) Object.assign(job, { state: 'error', msg: r.error })
      else localJobs.splice(localJobs.indexOf(job), 1)  // the server's job row takes over
      renderImports(); startPolling(); done()
    }
    x.onerror = () => { Object.assign(job, { state: 'error', msg: 'upload failed: is the server running?' }); renderImports(); done() }
    x.send(f)
  })
}
async function upload(files) { for (const f of files) await uploadOne(f) }
$('addBtn').onclick = addSrc
$('addSrc').addEventListener('keydown', e => { if (e.key === 'Enter') addSrc() })
$('browseBtn').onclick = () => $('fileIn').click()
$('fileIn').onchange = e => { upload([...e.target.files]); e.target.value = '' }
let dragDepth = 0
document.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; $('drop').hidden = false } })
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true } })
document.addEventListener('dragover', e => e.preventDefault())
document.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('drop').hidden = true
  if (e.dataTransfer.files.length) upload([...e.dataTransfer.files])
})

await loadLibrary(); refreshExports(); startPolling()
</script>
</body>
</html>
